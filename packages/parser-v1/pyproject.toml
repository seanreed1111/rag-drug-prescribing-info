[project]
name = "parser-v1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sean Reed", email = "sreed1111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.1",
    "llama-index-llms-groq>=0.4.1",
    "llama-index>=0.14.15",
    "llama-index-vector-stores-chroma>=0.5.5",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.4",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-embeddings-cohere>=0.7.0",
    "langchain-text-splitters>=1.1.1",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.2",
    "langchain-community>=0.4.1",
    "langchain>=1.2.10",
]

[tool.pytest.ini_options]
testpaths = ["src/parser_v1/tests"]

[project.scripts]
parser-v1 = "parser_v1:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
