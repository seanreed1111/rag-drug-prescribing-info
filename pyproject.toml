[project]
name = "drug-prescribing-info"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"



[tool.ty.src]
include = ["src"]
exclude = [".venv", "dist", "build", "*.egg-info"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "warn"

[tool.uv.workspace]
members = ["dummy-package", "packages/parser-v2", "packages/parser-v1"]
